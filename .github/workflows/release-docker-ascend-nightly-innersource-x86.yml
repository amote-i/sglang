name: nightly dev x86 image build and push for innersource

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [ upstream/251031 ]
    paths:
      - ".github/workflows/release-docker-ascend-nightly-innersource.yml"
      - "docker/npu.Dockerfile"
concurrency:
  group: release-docker-ascend-nightly-innersource-x86-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted-x86
    strategy:
      matrix:
        cann_version: ["8.3.rc1"]
        device_type: ["a3", "910b"]
    steps:
      - name: Checkout repository
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.ADMIN_PAT }}

      - name: Checkout no repository
        if: github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          platforms: linux/amd64

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ vars.REGISTRY_HK }}/base_image/ascend-ci/sglang
          # will generate tags with following rules:
          # - on PR: pr-<short-sha>
          # - on schedule: main-<YYYYMMDD>-<device_type> and main-<device_type>
          # - on manual dispatch: main-<device_type>
          # default tag: main (equal to main-a3)
          tags: |
            type=ref,event=pr,suffix=-{{sha}}-x86
            type=ref,event=branch,suffix=-${{ matrix.device_type }}-x86
            type=schedule,pattern=main-{{date 'YYYYMMDD' tz='Asia/Shanghai'}}-${{ matrix.device_type }}-x86
            type=schedule,pattern=main-${{ matrix.device_type }}-x86
            type=raw,value=main,enable=${{ matrix.device_type == 'a3' }},suffix=-x86
      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ vars.REGISTRY_HK }}
        if: ${{ github.repository == 'Ascend/sglang' && github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_HK }}
          username: ${{ vars.REGISTRY_HK_USER }}
          password: ${{ secrets.REGISTRY_HK_PASSWORD }}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/npu.Dockerfile
          platforms: linux/amd64
          push: ${{ github.repository == 'Ascend/sglang' && github.event_name != 'pull_request' }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          provenance: false
          build-args: |
            CANN_VERSION=${{ matrix.cann_version }}
            DEVICE_TYPE=${{ matrix.device_type }}
            REGISTRY=${{ vars.REGISTRY_HK }}/base_image/ascend-ci
            PIP_INDEX_URL=https://repo.huaweicloud.com/repository/pypi/simple
            APTMIRROR=repo.huaweicloud.com
  sync:
    needs: build
    if: github.repository == 'Ascend/sglang' && github.event_name != 'pull_request'
    runs-on: self-hosted-x86
    container:
      image: quay.io/skopeo/stable:latest
    steps:
      - name: Sync image to cn-east4
        run: |
          for TAG in $(echo "${{ needs.build.outputs.tags }}" | tr ',' '\n'); do
            echo "Syncing tag: $TAG"
            skopeo copy --all --dest-creds ${{ vars.REGISTRY_CN_EAST4_USER }}:${{ secrets.REGISTRY_CN_EAST4_PASSWORD }} \
            docker://${{ vars.REGISTRY_HK }}/base_image/ascend-ci/sglang:$TAG \
            docker://${{ vars.REGISTRY_CN_EAST4 }}/base_image/ascend-ci/sglang:$TAG
          done
